    <script>
      (function(){try{var s=localStorage.getItem("theme");var d=window.matchMedia("(prefers-color-scheme:dark)").matches;var isDark=s==="dark"||(s!=="light"&&d);var r=document.documentElement;r.classList.toggle("dark",isDark);r.classList.toggle("light",!isDark);r.dataset.mode=isDark?"dark":"light"}catch(e){}})()
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
