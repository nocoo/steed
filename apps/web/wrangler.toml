name = "steed"
workers_dev = false
preview_urls = false
main = "worker/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

[dev]
ip = "127.0.0.1"
port = 37035
inspector_port = 38035
upstream_protocol = "https"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Secrets (set via `wrangler secret put --env <env>`):
#   DASHBOARD_SERVICE_TOKEN — internal Bearer token for dashboard → API path
#   CONNECT_MANAGERS — explicitly authorized Access principals
#   CONNECT_TOKEN_KEYS — versioned AES keyring for recoverable credentials

# ── Production: steed.hexly.ai ────────────────────────────────────────
[env.production]
name = "steed"
routes = [
  { pattern = "steed.hexly.ai", custom_domain = true }
]

[env.production.vars]
CF_ACCESS_TEAM = "nocoo"
CF_ACCESS_AUD = "29357a96bddbff5c8063138868e4d55cca100df0e1c3856bf9a86fa3ec8319da"
CONNECT_DEPLOYMENT_ID = "steed-production"

[env.production.secrets]
required = ["DASHBOARD_SERVICE_TOKEN", "CONNECT_MANAGERS", "CONNECT_TOKEN_KEYS"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "steed"
database_id = "8c69f63f-38a5-4ad4-9832-ee04e0b2237d"
migrations_dir = "../../packages/worker/migrations"

# ── Local development: Caddy HTTPS with explicit local auth bypass ────
# Always run with: wrangler dev --env dev --local --persist-to .wrangler/state/web
# D1 is local SQLite — the database_id below is only for schema reference.
[env.dev]
name = "steed-dev"

[env.dev.vars]
CF_ACCESS_TEAM = "nocoo"
CF_ACCESS_AUD = "29357a96bddbff5c8063138868e4d55cca100df0e1c3856bf9a86fa3ec8319da"
CF_ACCESS_DEV_BYPASS = "true"
DASHBOARD_SERVICE_TOKEN = "dev-token"
CONNECT_DEPLOYMENT_ID = "steed-development"

[env.dev.secrets]
required = ["CONNECT_MANAGERS", "CONNECT_TOKEN_KEYS"]

[[env.dev.d1_databases]]
binding = "DB"
database_name = "steed"
database_id = "8c69f63f-38a5-4ad4-9832-ee04e0b2237d"
migrations_dir = "../../packages/worker/migrations"
