name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae # main 2026-10-22
    with:
      runtime-version: "1.4.2"
      install-policy: "project"
      test-command: |
        bun run test
        bun run check-coverage
      typecheck-command: "bun run typecheck"
      lint-command: "bun run lint"
      l2: true
      l2-command: "bun run test:e2e"
