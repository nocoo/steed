name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@2857469cc5206e7a4988171a1282209617996a67
    with:
      runtime-version: "1.4.2"
      install-policy: "project"
      test-command: |
        bun run test
        bun run check-coverage
      typecheck-command: "bun run typecheck"
      lint-command: "bun run lint"
      l2: true
      l2-command: "bun run test:e2e"
    secrets: inherit
