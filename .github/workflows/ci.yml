name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd # v2026.10
    with:
      runtime-version: "1.4.2"
      install-policy: "project"
      test-command: |
        bun run test
        bun run check-coverage
      typecheck-command: "bun run typecheck"
      lint-command: "bun run lint"
      l2: true
      l2-command: "bun run test:e2e"
      l3: true
      l3-command: "bun run test:browser"
