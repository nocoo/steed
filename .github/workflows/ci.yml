name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@0394178ebcff0418c442d84a84119220f31f8987 # v2026.9
    with:
      runtime-version: "1.4.2"
      install-policy: "project"
      test-command: |
        bun run test
        bun run check-coverage
      typecheck-command: "bun run typecheck"
      lint-command: "bun run lint"
      l2: true
      l2-command: "bun run test:e2e"
